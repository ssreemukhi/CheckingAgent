<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Checking Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
/* Checking Agent — visual system
   Petrol teal + saffron on a cool grey page. IBM Plex Sans for all text, tabular figures for numbers. */
:root{
  --ca-ink:#1D2B33; --ca-muted:#5E6B70; --ca-line:#D6DCDB; --ca-bg:#EEF1F0; --ca-surface:#FFFFFF; --ca-row:#F6F8F7;
  --ca-primary:#0E4F54; --ca-primary-strong:#0A3B3F; --ca-primary-soft:#DCEBEA;
  --ca-accent:#D9921A; --ca-accent-soft:#FBEFD9;
  --ca-ok:#1B7A55; --ca-ok-soft:#DDF1E7; --ca-bad:#B2362B; --ca-bad-soft:#F8E1DE;
  --ca-warn:#9A6200; --ca-warn-soft:#FCEFD2; --ca-neutral-soft:#E7EAEA;
  --ca-radius:6px; --ca-radius-lg:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;background:var(--ca-bg);color:var(--ca-ink)}
h1,h2,h3,h4{color:var(--ca-ink);line-height:1.25}
a{color:var(--ca-primary);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ca-accent);outline-offset:2px}
table,.ca-stat-value,.ca-badge,.ca-navlink-count,.ca-count{font-variant-numeric:tabular-nums}
.ca-icon{flex-shrink:0;vertical-align:-3px}

/* ---------- App frame: full-width top bar + light left pane ---------- */
.ca-app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);grid-template-areas:"top top" "nav page";min-height:100vh}
.ca-topbar{grid-area:top;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;background:var(--ca-primary);color:#fff}
.ca-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ca-brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:8px;background:var(--ca-accent);color:var(--ca-primary-strong)}
.ca-brand-name{font-weight:700;font-size:1rem;letter-spacing:-.005em}
.ca-brand .ca-muted{font-size:.75rem;color:rgba(255,255,255,.72)}
.ca-account{display:flex;align-items:center;gap:10px;font-size:.8125rem}
.ca-avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ca-surface);color:var(--ca-primary);font-weight:700;font-size:.875rem}
.ca-account-id{line-height:1.3}
.ca-account-email{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca-account-role{font-size:.6875rem;color:rgba(255,255,255,.72)}
.ca-signout{display:flex;align-items:center;gap:6px;margin-left:8px;padding:6px 10px;border:1px solid rgba(255,255,255,.35);border-radius:var(--ca-radius);background:transparent;color:#fff;font-size:.75rem;cursor:pointer}
.ca-signout:hover{background:rgba(255,255,255,.1)}
.ca-sidenav{grid-area:nav;position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow-y:auto;padding:18px 12px;background:var(--ca-surface);border-right:1px solid var(--ca-line)}
.ca-nav{display:flex;flex-direction:column;gap:2px}
.ca-navlink{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--ca-ink);font-size:.875rem;font-weight:500;text-align:left;cursor:pointer}
.ca-navlink:hover{background:var(--ca-row)}
.ca-navlink.active{background:var(--ca-primary-soft);color:var(--ca-primary-strong);font-weight:600}
.ca-navlink.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ca-accent)}
.ca-navlink-icon{color:var(--ca-primary)}
.ca-navlink-label{flex:1}
.ca-navlink-count{min-width:22px;padding:0 6px;border-radius:999px;background:var(--ca-neutral-soft);color:var(--ca-muted);font-size:.6875rem;font-weight:600;text-align:center;line-height:18px}
.ca-navlink.active .ca-navlink-count{background:var(--ca-surface);color:var(--ca-primary)}
.ca-nav-divider{height:1px;margin:10px 8px;background:var(--ca-line)}

/* ---------- Page ---------- */
.ca-page{grid-area:page;width:100%;max-width:1440px;padding:0 32px 48px}
.ca-pagehead{padding:32px 0 20px;border-bottom:1px solid var(--ca-line);margin-bottom:24px}
.ca-kicker{font-size:.8125rem;font-weight:600;color:var(--ca-primary)}
.ca-pagehead h2{margin:6px 0 8px;font-size:2rem;font-weight:700;letter-spacing:-.015em}
.ca-lede{margin:0;max-width:72ch;color:var(--ca-muted);font-size:.9375rem}
.ca-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ca-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--ca-line);background:var(--ca-surface);font-size:.75rem;font-weight:600;color:var(--ca-ink)}
.ca-tag-dot{width:7px;height:7px;border-radius:50%;background:var(--ca-muted)}
.ca-tag--ok .ca-tag-dot{background:var(--ca-ok)}
.ca-tag--warn .ca-tag-dot{background:var(--ca-accent)}
.ca-tag--bad .ca-tag-dot{background:var(--ca-bad)}
.ca-body{padding:0}

/* ---------- Panels and section titles ---------- */
.ca-panel{background:var(--ca-surface);border:1px solid var(--ca-line);border-radius:var(--ca-radius-lg);margin-bottom:20px}
.ca-panel.is-wide{width:100%}
.ca-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ca-line)}
.ca-panel-head h4{margin:0;font-size:1rem;font-weight:700}
.ca-panel-body{padding:18px}
.ca-section-title{display:flex;align-items:baseline;gap:8px;margin:28px 0 12px;font-size:1.0625rem;font-weight:700}
.ca-section-title .ca-muted{font-size:.8125rem;font-weight:400;color:var(--ca-muted)}
.ca-grow{flex:1}
.ca-section-aside{font-size:.8125rem;font-weight:500}

/* ---------- Summary figures: one joined strip, not separate cards ---------- */
.ca-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ca-grid-4,.ca-grid-5{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--ca-surface);border:1px solid var(--ca-line);border-radius:var(--ca-radius-lg);overflow:hidden}
.ca-grid-5{grid-template-columns:repeat(5,1fr)}
.ca-stat{padding:16px 20px;border-left:1px solid var(--ca-line)}
.ca-grid-4 .ca-stat:first-child,.ca-grid-5 .ca-stat:first-child{border-left:0}
.ca-grid-2 .ca-stat{border:1px solid var(--ca-line);border-radius:var(--ca-radius-lg);background:var(--ca-surface)}
.ca-stat-label{font-size:.8125rem;font-weight:600;color:var(--ca-muted)}
.ca-stat-value{margin-top:2px;font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ca-stat-value.suc{color:var(--ca-ok)}
.ca-stat-value.dng{color:var(--ca-bad)}
.ca-stat-value.wrn{color:var(--ca-warn)}
.ca-stat-note{margin-top:2px;font-size:.75rem;color:var(--ca-muted)}

/* ---------- Dashboard: review pipeline + start panel ---------- */
.ca-dash-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.ca-pipeline{margin:0;display:flex;flex-direction:column}
.ca-pipeline .ca-panel-body{flex:1;display:flex;flex-direction:column;justify-content:center}
.ca-pipeline-note{font-size:.8125rem;font-weight:600;color:var(--ca-warn)}
.ca-pipeline-bar{display:flex;gap:3px;height:14px;margin:4px 0 22px;border-radius:999px;overflow:hidden;background:var(--ca-neutral-soft)}
.ca-pipeline-seg{min-width:8px}
.ca-seg--neutral{background:#98A6A8}
.ca-seg--info{background:var(--ca-primary)}
.ca-seg--bad{background:var(--ca-bad)}
.ca-seg--ok{background:var(--ca-ok)}
.ca-pipeline-stages{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.ca-stage{padding:0 16px;border-left:1px solid var(--ca-line)}
.ca-stage:first-child{padding-left:0;border-left:0}
.ca-stage-head{display:flex;align-items:center;gap:7px;font-size:.8125rem;font-weight:600;color:var(--ca-muted)}
.ca-stage-dot{width:9px;height:9px;border-radius:50%}
.ca-stage-value{margin-top:6px;font-size:2.5rem;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ca-stage-note{margin-top:6px;font-size:.75rem;color:var(--ca-muted)}
.ca-cta{display:flex;flex-direction:column;padding:22px 24px;border-radius:var(--ca-radius-lg);background:var(--ca-primary);color:#fff;cursor:pointer;transition:background .15s}
.ca-cta:hover{background:var(--ca-primary-strong)}
.ca-cta h3{margin:0 0 16px;color:#fff;font-size:1.125rem;font-weight:700}
.ca-flow{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:14px}
.ca-flow li{display:flex;align-items:flex-start;gap:12px}
.ca-flow li > .ca-flow-num{display:grid;margin-top:1px;place-items:center;width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);color:#fff;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.ca-flow strong{display:block;font-size:.875rem;font-weight:600}
.ca-flow li > div > span{display:block;font-size:.75rem;color:rgba(255,255,255,.74)}
.ca-btn.is-accent{margin-top:auto;align-self:flex-start;background:var(--ca-accent);border-color:var(--ca-accent);color:var(--ca-primary-strong)}
.ca-btn.is-accent:hover{background:#E4A23A;border-color:#E4A23A}

/* ---------- Upload ---------- */
.ca-dropzone{display:flex;flex-direction:column;align-items:center;padding:28px 18px;border:1.5px dashed #A9BFBD;border-radius:var(--ca-radius-lg);background:var(--ca-surface);text-align:center;cursor:pointer}
.ca-dropzone:hover{border-color:var(--ca-primary);background:var(--ca-row)}
.ca-dropzone.filled{border-style:solid;border-color:var(--ca-ok);background:var(--ca-ok-soft)}
.ca-dropzone-icon{display:grid;place-items:center;width:54px;height:54px;margin-bottom:10px;border-radius:50%;background:var(--ca-primary-soft);color:var(--ca-primary)}
.ca-dropzone.filled .ca-dropzone-icon{background:var(--ca-ok);color:#fff}
.ca-dropzone-title{font-weight:700;font-size:.9375rem;word-break:break-word}
.ca-dropzone .ca-muted{margin-top:4px;font-size:.75rem;color:var(--ca-muted)}
.ca-doctypes{display:flex;flex-wrap:wrap;justify-content:center;gap:0;margin-top:12px;border:1px solid var(--ca-line);border-radius:var(--ca-radius);overflow:hidden;background:var(--ca-surface)}
.ca-doctype{padding:5px 11px;border:0;border-left:1px solid var(--ca-line);background:transparent;font-size:.75rem;font-weight:500;cursor:pointer}
.ca-doctype:first-child{border-left:0}
.ca-doctype.active{background:var(--ca-primary);color:#fff}

/* ---------- Forms ---------- */
.ca-field{display:flex;flex-direction:column;gap:5px}
.ca-label{font-size:.8125rem;font-weight:600;color:var(--ca-ink)}
.ca-input,.ca-select{padding:9px 11px;border:1px solid #BCC7C6;border-radius:var(--ca-radius);background:var(--ca-surface);font-size:.875rem}
.ca-input:focus,.ca-select:focus{outline:none;border-color:var(--ca-primary);box-shadow:0 0 0 3px var(--ca-primary-soft)}
.ca-check-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--ca-line);cursor:pointer}
.ca-check-row:last-child{border-bottom:0}
.ca-check-row:hover{background:var(--ca-row)}
.ca-check-row.selected{background:var(--ca-primary-soft)}
.ca-checkbox{display:grid;place-items:center;width:20px;height:20px;flex-shrink:0;border:1.5px solid #9FB1AF;border-radius:5px;background:var(--ca-surface);color:#fff}
.ca-check-row.selected .ca-checkbox{border-color:var(--ca-primary);background:var(--ca-primary)}
.ca-check-name{font-weight:600;font-size:.875rem}
.ca-check-meta,.ca-check-count{font-size:.75rem;color:var(--ca-muted)}

/* ---------- Buttons ---------- */
.ca-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border:1px solid transparent;border-radius:var(--ca-radius);font-size:.875rem;font-weight:600;cursor:pointer;background:var(--ca-surface);color:var(--ca-ink);border-color:#BCC7C6}
.ca-btn.is-primary{background:var(--ca-primary);border-color:var(--ca-primary);color:#fff}
.ca-btn.is-primary:hover{background:var(--ca-primary-strong)}
.ca-btn.is-primary:disabled{background:#9DB5B3;border-color:#9DB5B3;cursor:not-allowed}
.ca-btn.is-quiet{background:transparent;border-color:#BCC7C6;color:var(--ca-primary)}
.ca-btn.is-quiet:hover{background:var(--ca-primary-soft)}
.ca-btn.is-small{padding:4px 10px;font-size:.75rem}
.ca-btn:disabled{cursor:not-allowed}

/* ---------- Filters: joined segmented control ---------- */
.ca-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ca-filters{display:inline-flex;flex-wrap:wrap;border:1px solid #BCC7C6;border-radius:var(--ca-radius);overflow:hidden;background:var(--ca-surface)}
.ca-filter{display:flex;align-items:center;gap:7px;padding:7px 13px;border:0;border-left:1px solid #BCC7C6;background:transparent;font-size:.8125rem;font-weight:500;cursor:pointer}
.ca-filter:first-child{border-left:0}
.ca-filter:hover{background:var(--ca-row)}
.ca-filter.active{background:var(--ca-primary);color:#fff}
.ca-count{padding:0 6px;border-radius:4px;background:var(--ca-neutral-soft);font-size:.6875rem;font-weight:600;line-height:18px}
.ca-filter.active .ca-count{background:rgba(255,255,255,.2)}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:.875rem;background:var(--ca-surface)}
th{padding:10px 12px;text-align:left;background:var(--ca-row);color:var(--ca-muted);font-size:.75rem;font-weight:600;border-bottom:1px solid var(--ca-line)}
td{padding:10px 12px;border-bottom:1px solid var(--ca-line);vertical-align:top}
tbody tr:hover td{background:#FAFBFB}
tr.is-clean td:first-child{box-shadow:inset 3px 0 0 var(--ca-ok)}
.ca-center{text-align:center}
.ca-group-row{padding:9px 12px;background:var(--ca-primary-soft);color:var(--ca-primary-strong);font-size:.8125rem;font-weight:700}
.ca-group-row .ca-count{float:right;background:transparent;font-weight:500;color:var(--ca-primary)}
.ca-run-title{font-weight:600}
.ca-run-sub{font-size:.75rem;color:var(--ca-muted)}
.ca-value{word-break:break-word}
.ca-value.empty{color:var(--ca-muted);font-style:italic}
.ca-remark{width:100%;padding:6px 8px;border:1px solid #BCC7C6;border-radius:5px;font-size:.75rem;background:var(--ca-surface)}
.ca-remark.has{border-color:var(--ca-primary);background:var(--ca-primary-soft)}

/* ---------- Badges ---------- */
.ca-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:.6875rem;font-weight:700;line-height:1.6;white-space:nowrap}
.ca-badge--ok{background:var(--ca-ok-soft);color:var(--ca-ok)}
.ca-badge--bad{background:var(--ca-bad-soft);color:var(--ca-bad)}
.ca-badge--warn{background:var(--ca-warn-soft);color:var(--ca-warn)}
.ca-badge--neutral{background:var(--ca-neutral-soft);color:var(--ca-muted)}
.ca-badge--info{background:var(--ca-primary-soft);color:var(--ca-primary)}

/* ---------- Callouts ---------- */
.ca-callout{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;margin-bottom:16px;border-radius:var(--ca-radius-lg);border:1px solid}
.ca-callout--suc{background:var(--ca-ok-soft);border-color:#B5DCC8}
.ca-callout--wrn{background:var(--ca-warn-soft);border-color:#EDD3A1}
.ca-callout--dng{background:var(--ca-bad-soft);border-color:#EBB9B3}
.ca-callout-icon{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:8px;background:var(--ca-surface)}
.ca-callout--suc .ca-callout-icon{color:var(--ca-ok)}
.ca-callout--wrn .ca-callout-icon{color:var(--ca-warn)}
.ca-callout--dng .ca-callout-icon{color:var(--ca-bad)}
.ca-callout-text h4{margin:2px 0 3px;font-size:.9375rem}
.ca-callout-text p{margin:0;font-size:.8125rem}

/* ---------- Tabs ---------- */
.ca-tabs{display:flex;gap:4px;border-bottom:1px solid var(--ca-line);overflow-x:auto}
.ca-tab{padding:12px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ca-muted);font-size:.875rem;font-weight:600;white-space:nowrap;cursor:pointer}
.ca-tab:hover{color:var(--ca-ink)}
.ca-tab.active{color:var(--ca-ink);border-bottom-color:var(--ca-accent)}
.ca-tabpanel{display:none}
.ca-tabpanel.active{display:block}

/* ---------- Processing ---------- */
.ca-progress{max-width:640px;padding:28px;background:var(--ca-surface);border:1px solid var(--ca-line);border-radius:var(--ca-radius-lg)}
.ca-progress h3{margin:0 0 4px}
.ca-progress .ca-muted{margin-bottom:6px;font-size:.8125rem;color:var(--ca-muted)}
.ca-progress-track{height:8px;margin:14px 0 20px;border-radius:999px;background:var(--ca-neutral-soft);overflow:hidden}
.ca-progress-fill{height:100%;background:var(--ca-primary);transition:width .2s}
.ca-steps{display:flex;flex-direction:column}
.ca-step{display:flex;align-items:center;gap:12px;padding:9px 0}
.ca-step-marker{display:grid;place-items:center;width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--ca-line);background:var(--ca-surface);color:var(--ca-muted);font-size:.75rem;font-weight:600}
.ca-step.active .ca-step-marker{border-color:var(--ca-accent);background:var(--ca-accent-soft);color:var(--ca-warn)}
.ca-step.done .ca-step-marker{border-color:var(--ca-ok);background:var(--ca-ok);color:#fff}
.ca-step-label{flex:1;font-size:.875rem}
.ca-step-time{font-size:.75rem;color:var(--ca-muted)}

/* ---------- Dialog and toast ---------- */
.ca-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(29,43,51,.45)}
.ca-dialog{width:90%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--ca-surface);border-radius:var(--ca-radius-lg);box-shadow:0 18px 50px rgba(29,43,51,.3)}
.ca-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ca-line)}
.ca-dialog-head h3{margin:0;font-size:1.0625rem}
.ca-dialog-body{padding:20px}
.ca-dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--ca-line)}
.ca-close{border:0;background:none;color:var(--ca-muted);font-size:1.25rem;cursor:pointer}
.ca-toast{position:fixed;right:20px;bottom:20px;z-index:60;padding:12px 18px;border-radius:var(--ca-radius);background:var(--ca-ink);color:#fff;font-size:.875rem;box-shadow:0 8px 24px rgba(29,43,51,.25)}

/* ---------- Small screens and motion ---------- */
@media (max-width:900px){
  .ca-app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top" "nav" "page"}
  .ca-topbar{position:static;padding:10px 16px;min-height:60px}
  .ca-brand .ca-muted,.ca-account-id{display:none}
  .ca-sidenav{position:static;height:auto;padding:6px 10px;border-right:0;border-bottom:1px solid var(--ca-line);overflow-x:auto}
  .ca-nav{flex-direction:row}
  .ca-navlink{width:auto;white-space:nowrap}
  .ca-nav-divider{width:1px;height:auto;margin:6px 4px}
  .ca-page{padding:0 16px 40px}
  .ca-grid-4,.ca-grid-5{grid-template-columns:1fr 1fr}
  .ca-dash-hero{grid-template-columns:1fr}
  .ca-pipeline-stages{grid-template-columns:1fr 1fr;row-gap:16px}
  .ca-stage:nth-child(3){padding-left:0;border-left:0}
  .ca-pagehead h2{font-size:1.5rem}
  .ca-grid-4 .ca-stat:nth-child(3),.ca-grid-5 .ca-stat:nth-child(odd){border-left:0}
  .ca-grid-4 .ca-stat:nth-child(n+3),.ca-grid-5 .ca-stat:nth-child(n+3){border-top:1px solid var(--ca-line)}
  .ca-grid-2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
