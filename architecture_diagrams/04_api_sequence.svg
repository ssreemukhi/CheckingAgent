<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1460" viewBox="0 0 680 730"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="730" fill="#FFFFFF"/><g><rect x="15" y="30" width="140" height="44" rx="8" stroke-width="0.5" fill="#FFFFFF" stroke="#B4B2A9"/><rect x="23" y="44" width="16" height="16" rx="3" fill="none" stroke="#9C9A92" stroke-width="0.8" stroke-dasharray="2 2"/><text x="92" y="56.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Browser</text></g><g><rect x="185" y="30" width="140" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><rect x="193" y="44" width="16" height="16" rx="3" fill="none" stroke="#9C9A92" stroke-width="0.8" stroke-dasharray="2 2"/><text x="262" y="56.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#085041">Cloud Run</text></g><g><rect x="355" y="30" width="140" height="44" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/><rect x="363" y="44" width="16" height="16" rx="3" fill="none" stroke="#9C9A92" stroke-width="0.8" stroke-dasharray="2 2"/><text x="432" y="56.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">Vertex AI</text></g><g><rect x="525" y="30" width="140" height="44" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/><rect x="533" y="44" width="16" height="16" rx="3" fill="none" stroke="#9C9A92" stroke-width="0.8" stroke-dasharray="2 2"/><text x="602" y="56.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">Firestore</text></g><g stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"><line x1="85" y1="74" x2="85" y2="705"/><line x1="255" y1="74" x2="255" y2="705"/><line x1="425" y1="74" x2="425" y2="705"/><line x1="595" y1="74" x2="595" y2="705"/></g><g><rect x="175" y="298" width="160" height="28" rx="6" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/><text x="255" y="316.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#085041">Extract text (pdfplumber)</text></g><text x="170.0" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">1. GET /</text><line x1="85" y1="110" x2="253" y2="110" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">index.html + React app</text><line x1="255" y1="144" x2="87" y2="144" stroke-dasharray="4 3" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">2. POST /api/login</text><line x1="85" y1="178" x2="253" y2="178" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Session cookie (or 401)</text><line x1="255" y1="212" x2="87" y2="212" stroke-dasharray="4 3" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="239" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">3. GET me, checklists</text><line x1="85" y1="246" x2="253" y2="246" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">4. POST /api/compare</text><line x1="85" y1="280" x2="253" y2="280" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="340.0" y="341" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">5. Gemini request</text><line x1="255" y1="348" x2="423" y2="348" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="340.0" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Field results (JSON)</text><line x1="425" y1="382" x2="257" y2="382" stroke-dasharray="4 3" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="425.0" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">6. Save run + usage</text><line x1="255" y1="416" x2="593" y2="416" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="443" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Discrepancy report</text><line x1="255" y1="450" x2="87" y2="450" stroke-dasharray="4 3" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">7. GET /api/history</text><line x1="85" y1="484" x2="253" y2="484" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="425.0" y="511" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Read runs</text><line x1="255" y1="518" x2="593" y2="518" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">8. POST approve / reject</text><line x1="85" y1="552" x2="253" y2="552" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="425.0" y="579" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Update run status</text><line x1="255" y1="586" x2="593" y2="586" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="613" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">9. GET /api/admin/stats</text><line x1="85" y1="620" x2="253" y2="620" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="425.0" y="647" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">Aggregate runs</text><line x1="255" y1="654" x2="593" y2="654" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/><text x="170.0" y="681" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">10. POST /api/logout</text><line x1="85" y1="688" x2="253" y2="688" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/></svg>